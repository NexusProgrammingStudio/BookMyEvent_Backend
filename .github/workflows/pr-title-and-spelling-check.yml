name: PR Title and Spelling Check

on:
  pull_request:
    types: [ opened, edited, synchronize ]

jobs:
  pr-title-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate PR title
        uses: actions/github-script@v7
        with:
          script: |
            const prTitle = context.payload.pull_request.title;
            const titleRegex = /^(feat|fix|chore|docs|style|refactor|test|ci|add): .+$/;
            if (!titleRegex.test(prTitle)) {
              core.setFailed(
                `Invalid PR title: "${prTitle}".\n` +
                `PR titles must follow the format "<type>: <description>".\n` +
                `Allowed types: feat, fix, chore, docs, style, refactor, test, ci, add.`
              );
            }

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install codespell
        run: |
          pip install codespell

      - name: Run spelling check
        run: |
          codespell --ignore-words-list="crate,from,form,fin" --skip="*.png,*.jpg,*.jpeg,*.gif,*.svg" .

      - name: Upload annotations for spelling errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spelling-errors
          path: codespell-output.txt

      - name: Fail if spelling errors are found
        if: failure()
        run: exit 1
